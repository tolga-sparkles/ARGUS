{% extends "base.html" %}

{% block page_title %}History{% endblock %}
{% block page_subtitle %}Infrastructure incidents and state changes{% endblock %}

{% block content %}
<div class="toolbar">
  <div class="toolbar-left">
    <input type="text" class="search-input" id="historySearch" placeholder="Search server..." autocomplete="off">
    <div class="filter-tabs" id="historyStatusTabs">
      <button class="chip active" data-status="all" type="button">All</button>
      <button class="chip" data-status="recovered" type="button">Recovered</button>
      <button class="chip" data-status="active" type="button">Active</button>
    </div>
    <select class="filter-select" id="severitySelect">
      <option value="all">Severity: All</option>
      <option value="critical">Severity: Critical</option>
      <option value="warning">Severity: Warning</option>
      <option value="offline">Severity: Offline</option>
      <option value="no_telemetry">Severity: No Telemetry</option>
    </select>
    <select class="filter-select" id="rangeSelect">
      <option value="24h">Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="all" selected>All time</option>
    </select>
  </div>
</div>

<div class="page-list" id="historyList"></div>
<div class="pagination" id="historyPagination"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') ~ '?v=3' }}"></script>
{% endblock %}
